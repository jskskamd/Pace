<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pacemock</title>
  <meta name="description" content="Mock tests for the NUET.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
  <script src="theme.js?v=6"></script>
</head>
<body>

  <header class="top wrap">
    <div class="bar">
      <a class="brand" href="index.html">
        <svg class="mark" viewBox="0 0 64 44" aria-hidden="true">
          <g fill="none" stroke-width="7" stroke-linecap="round">
            <path class="mark-tail" d="M46 13A23 23 0 0 1 55 34"/>
            <path class="mark-arc" d="M9 34A23 23 0 0 1 46 13"/>
          </g>
          <circle cx="46" cy="13" r="6.5" fill="#f2b544"/>
        </svg>
        Pacemock
      </a>
      <div class="top-right">
        <a class="channel" href="https://t.me/Pacemock" target="_blank" rel="noopener" aria-label="Telegram channel @Pacemock">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#27a7e7"/><path fill="#fff" d="M5.5 11.6l12.4-4.8c.6-.2 1.1.1.9.9l-2.1 9.9c-.2.7-.6.9-1.2.6l-3.2-2.4-1.5 1.5c-.2.2-.3.3-.7.3l.2-3.3 6-5.4c.3-.2-.1-.4-.4-.2l-7.4 4.7-3.2-1c-.7-.2-.7-.7.2-1z"/></svg>
          <span>@Pacemock</span>
        </a>
        <button class="icon-button search" type="button" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
        <button class="icon-button" id="theme" type="button">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="login" id="account" href="login.html">Log in</a>
        <div class="profile" id="profile" hidden>
          <button class="avatar" id="avatar" type="button" aria-label="Your account" aria-haspopup="true" aria-expanded="false"></button>
          <div class="profile-menu" id="profile-menu" hidden>
            <p class="profile-label">Signed in as</p>
            <p class="profile-email" id="profile-email"></p>
            <button class="auth-link" id="logout" type="button">Log out</button>
          </div>
        </div>
        <a class="get-started" id="get-started" href="login.html?mode=register">Get Started</a>
      </div>
    </div>
  </header>

  <main class="stage wrap">
    <section class="card" id="hero">
      <svg class="arc" viewBox="0 0 300 200" aria-hidden="true">
        <g fill="none" stroke-width="27" stroke-linecap="round">
          <path class="arc-tail" d="M236 87A120 120 0 0 1 270 170"/>
          <path class="arc-main" d="M30 170A120 120 0 0 1 236 87"/>
        </g>
        <circle cx="236" cy="87" r="29" fill="#f2b544"/>
      </svg>

      <div class="card-text">
        <h1>Prepare for <span class="accent">NUET</span> with Pacemock</h1>
        <p class="lede">Exclusive NUET-style mock exams created by NU students</p>

        <div class="choice">
          <div class="start-area">
            <button class="start" id="start-mock" type="button">Start mock test <span aria-hidden="true">→</span></button>
          </div>

          <div class="mocks" id="mocks" inert>
            <button class="mock" data-subject="math" type="button">
              <span class="mock-name">Math</span>
              <span class="mock-note">2 mocks</span>
            </button>
            <button class="mock" data-subject="crit" type="button">
              <span class="mock-name">Critical Thinking &amp; PS</span>
              <span class="mock-note">1 mock</span>
            </button>
            <button class="back" id="back" type="button">← Back</button>
          </div>
        </div>
      </div>

      <div class="subject" id="subject" inert>
        <button class="subject-back" id="subject-back" type="button">← Back</button>
        <h2 id="subject-title"></h2>
        <div class="subject-list" id="subject-list"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js?v=6"></script>
  <script src="auth.js?v=6"></script>
  <script>
    const hero = document.getElementById("hero");
    const startButton = document.getElementById("start-mock");
    const mocks = document.getElementById("mocks");
    let scrollTimer;
    let unlockTimer;

    setupThemeButton(document.getElementById("theme"));

    function openMocks(e) {
      if (hero.classList.contains("open")) return;
      hero.classList.add("open");
      startButton.parentElement.inert = true;
      // detail is 0 for keyboard presses: keep those users' place on the page
      if (e.detail === 0) {
        mocks.inert = false;
        mocks.querySelector(".mock").focus({ preventScroll: true });
      } else {
        // The mocks appear under the cursor, so a double click must not open one
        unlockTimer = setTimeout(() => { mocks.inert = false; }, 450);
      }
      // On short screens the mocks can land below the fold
      scrollTimer = setTimeout(() => mocks.scrollIntoView({ block: "nearest", behavior: "smooth" }), 600);
    }

    startButton.addEventListener("click", openMocks);

    // Add a line here for each new mock. A mock with no href shows as coming soon.
    const SUBJECTS = {
      math: {
        title: "Math",
        mocks: [
          { name: "Mock 1", note: "30 questions · 60 minutes · 120 marks", href: "mock.html?subject=math" },
          { name: "Mock 2", note: "30 questions · 60 minutes", href: "mock.html?subject=math2" },
        ],
      },
      crit: {
        title: "Critical Thinking & PS",
        mocks: [
          { name: "Mock 1", note: "30 questions · 60 minutes", href: "mock.html?subject=crit" },
          { name: "Mock 2", note: "Coming soon" },
        ],
      },
    };

    const subject = document.getElementById("subject");

    function subjectRow(mock) {
      const row = document.createElement(mock.href ? "a" : "div");
      const name = document.createElement("span");
      const note = document.createElement("span");
      row.className = mock.href ? "subject-mock" : "subject-mock soon";
      if (mock.href) row.href = mock.href;
      name.className = "mock-name";
      name.textContent = mock.name;
      note.className = "mock-note";
      note.textContent = mock.note;
      row.append(name, note);
      return row;
    }

    function openSubject(e) {
      const chosen = SUBJECTS[e.currentTarget.dataset.subject];
      document.getElementById("subject-title").textContent = chosen.title;
      document.getElementById("subject-list").replaceChildren(...chosen.mocks.map(subjectRow));
      hero.classList.add("in-subject");
      hero.querySelector(".card-text").inert = true;
      subject.inert = false;
      if (e.detail === 0) document.getElementById("subject-back").focus({ preventScroll: true });
    }

    document.querySelectorAll("[data-subject]").forEach((button) => button.addEventListener("click", openSubject));

    document.getElementById("subject-back").addEventListener("click", (e) => {
      hero.classList.remove("in-subject");
      subject.inert = true;
      hero.querySelector(".card-text").inert = false;
      if (e.detail === 0) document.querySelector("[data-subject]").focus({ preventScroll: true });
    });

    setupAccount().then((signedIn) => {
      if (!signedIn) return;
      document.getElementById("get-started").hidden = true;
      addAccountMocks();
    });

    // The database only returns the mocks this account is allowed to open
    async function addAccountMocks() {
      const { data } = await db.from("mocks").select("id, title, minutes, total");
      for (const mock of data || []) {
        const link = document.createElement("a");
        const name = document.createElement("span");
        const note = document.createElement("span");
        link.className = "mock";
        link.href = `mock.html?subject=${encodeURIComponent(mock.id)}`;
        name.className = "mock-name";
        name.textContent = mock.title;
        note.className = "mock-note";
        note.textContent = `${mock.total} questions · ${mock.minutes} minutes`;
        link.append(name, note);
        document.getElementById("back").before(link);
      }
    }

    document.getElementById("back").addEventListener("click", (e) => {
      clearTimeout(scrollTimer);
      clearTimeout(unlockTimer);
      hero.classList.remove("open");
      mocks.inert = true;
      startButton.parentElement.inert = false;
      if (e.detail === 0) startButton.focus({ preventScroll: true });
    });
  </script>

</body>
</html>
