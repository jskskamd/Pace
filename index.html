<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUET Notes</title>
  <meta name="description" content="Mock tests for the NUET.">
  <link rel="stylesheet" href="style.css">
  <script>
    // Set before the page paints, so it never flashes the wrong mode
    (function () {
      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : prefersDark ? "dark" : "light";
    })();
  </script>
</head>
<body>

  <header>
    <div class="wrap top-inner">
      <a class="brand" href="./">NUET Notes</a>
      <button class="theme" id="theme" type="button">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="page wrap">
    <section class="hero" id="hero">
      <h1>Getting ready for the NUET? Start with a mock.</h1>
      <p class="lede">Two mock tests show you where you stand. After that, you'll know what to work on first.</p>

      <div class="reveal start-area">
        <div class="reveal-inner">
          <button class="start" id="start-mock" type="button">Start mock test</button>
        </div>
      </div>

      <div class="reveal mocks-area">
        <div class="reveal-inner mocks" id="mocks" inert>
          <button class="mock" type="button" disabled>
            <span class="mock-icon" aria-hidden="true">∑</span>
            <span class="mock-name">Math</span>
            <span class="mock-note">Not added yet</span>
          </button>
          <button class="mock" type="button" disabled>
            <span class="mock-icon" aria-hidden="true">?</span>
            <span class="mock-name">Critical Thinking &amp; PS</span>
            <span class="mock-note">Not added yet</span>
          </button>
          <button class="back" id="back" type="button">← Back</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="end">
    <div class="wrap">
      <p>NUET Notes is an independent study page, not connected to Nazarbayev University.</p>
    </div>
  </footer>

  <script>
    const hero = document.getElementById("hero");
    const startButton = document.getElementById("start-mock");
    const mocks = document.getElementById("mocks");
    const backButton = document.getElementById("back");
    const themeButton = document.getElementById("theme");
    let scrollTimer;

    function labelThemeButton() {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      themeButton.setAttribute("aria-label", `Switch to ${next} mode`);
    }
    labelThemeButton();

    themeButton.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
      labelThemeButton();
    });

    startButton.addEventListener("click", (e) => {
      hero.classList.add("open");
      startButton.parentElement.inert = true;
      mocks.inert = false;
      // detail is 0 for keyboard presses: keep those users' place on the page
      if (e.detail === 0) backButton.focus({ preventScroll: true });
      // On short screens the mocks can land below the fold
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      scrollTimer = setTimeout(() => mocks.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" }), 600);
    });

    backButton.addEventListener("click", (e) => {
      clearTimeout(scrollTimer);
      hero.classList.remove("open");
      mocks.inert = true;
      startButton.parentElement.inert = false;
      if (e.detail === 0) startButton.focus({ preventScroll: true });
    });
  </script>

</body>
</html>
