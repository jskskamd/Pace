<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock test · Pacemock</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mock.css">
  <script src="theme.js"></script>
</head>
<body class="exam-page">

  <main class="results" id="intro">
    <h1>Ready to begin?</h1>
    <p class="results-subject" id="intro-subject"></p>
    <p class="intro-note">The timer starts when you press Begin test.</p>
    <div class="confirm-actions">
      <a class="previous" href="index.html">Back</a>
      <button class="next" id="begin" type="button">Begin test</button>
    </div>
  </main>

  <div class="exam" id="exam" hidden>
    <aside class="side" id="side">
      <a class="side-logo" href="index.html" aria-label="Pacemock home">
        <svg class="mark" viewBox="0 0 64 44" aria-hidden="true">
          <g fill="none" stroke-width="7" stroke-linecap="round">
            <path class="mark-tail" d="M46 13A23 23 0 0 1 55 34"/>
            <path class="mark-arc" d="M9 34A23 23 0 0 1 46 13"/>
          </g>
          <circle cx="46" cy="13" r="6.5" fill="#f2b544"/>
        </svg>
      </a>
      <ul class="legend">
        <li><span class="swatch is-answered"></span>Answered</li>
        <li><span class="swatch is-current"></span>Current</li>
        <li><span class="swatch"></span>Not answered</li>
        <li><span class="swatch is-marked"></span>Marked</li>
      </ul>
      <nav class="grid" id="grid" aria-label="Questions"></nav>
    </aside>

    <div class="main">
      <header class="exam-head">
        <div class="head-left">
          <button class="toggle-side" id="toggle-side" type="button" aria-controls="side">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
          </button>
          <div>
            <h1>NUET Mock Test</h1>
            <p id="progress"></p>
          </div>
        </div>
        <div class="head-right">
          <span class="timer" id="timer" role="timer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
            <span id="time"></span>
          </span>
          <button class="icon-button" id="theme" type="button">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button class="finish" id="finish" type="button">Finish Test</button>
        </div>
      </header>

      <section class="question">
        <button class="bookmark" id="bookmark" type="button" aria-label="Mark this question">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg>
        </button>
        <p class="passage" id="passage" hidden></p>
        <table class="question-table" id="question-table" hidden></table>
        <p class="question-text" id="question-text"></p>
        <img class="question-image" id="question-image" alt="" hidden>
        <div class="options" id="options"></div>
      </section>

      <div class="exam-nav">
        <button class="previous" id="previous" type="button"><span aria-hidden="true">←</span> Previous</button>
        <button class="next" id="next" type="button">Next <span aria-hidden="true">→</span></button>
      </div>
    </div>
  </div>

  <main class="results" id="results" hidden>
    <h1>Test finished</h1>
    <p class="results-subject" id="results-subject"></p>
    <dl class="stats" id="stats"></dl>
    <div class="confirm-actions">
      <a class="previous" href="index.html">Back to home</a>
      <button class="next" id="show-review" type="button">See solutions</button>
    </div>
  </main>

  <main class="review" id="review" hidden>
    <div class="review-head">
      <h1>Solutions</h1>
      <button class="previous" id="hide-review" type="button"><span aria-hidden="true">←</span> Results</button>
    </div>
    <div id="review-list"></div>
  </main>

  <dialog class="confirm" id="confirm" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Finish the test?</h2>
    <p id="confirm-text"></p>
    <div class="confirm-actions">
      <button class="previous" id="keep-going" type="button">Keep going</button>
      <button class="next" id="confirm-finish" type="button">Finish</button>
    </div>
  </dialog>

  <script src="questions.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    // Math and Critical Thinking are in questions.js. Any other mock comes from
    // the database, which only hands it to accounts with access.
    (async () => {
      const id = new URLSearchParams(location.search).get("subject");
      if (id && !TESTS[id]) {
        const { data } = db
          ? await db.from("mocks").select("title, minutes, total, questions").eq("id", id).maybeSingle()
          : {};
        if (!data) {
          document.querySelector("#intro h1").textContent = "This mock isn't available";
          document.getElementById("intro-subject").textContent = "Log in with an account that has access to it.";
          document.querySelector("#intro .intro-note").hidden = true;
          document.getElementById("begin").hidden = true;
          return;
        }
        TESTS[id] = data;
      }
      const script = document.createElement("script");
      script.src = "mock.js";
      document.body.append(script);
    })();
  </script>
</body>
</html>
